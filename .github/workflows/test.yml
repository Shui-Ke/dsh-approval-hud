name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Host logic
        run: node tests/host.test.mjs
      - name: Package manifest
        run: node tests/package.test.mjs
